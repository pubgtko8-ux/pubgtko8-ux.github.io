
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, "メイリオ", sans-serif;
      background: linear-gradient(135deg, #dceaff, #f4f8ff);
      color: #26344d;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(40, 80, 140, 0.15);
    }

    header {
      padding: 45px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #1769aa, #42a5f5);
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 3px;
    }

    header p {
      margin-top: 12px;
      font-size: 16px;
    }

    main {
      padding: 30px;
    }

    section {
      margin-bottom: 25px;
      padding: 20px;
      background: #f4f8ff;
      border-left: 5px solid #3185cf;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
      color: #1769aa;
      font-size: 21px;
    }

    p {
      line-height: 1.8;
    }

    .message {
      text-align: center;
      background: #e5f2ff;
      border-left: none;
    }

    footer {
      padding: 15px;
      text-align: center;
      background: #1769aa;
      color: white;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      main {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MY PROFILE</h1>
      <p>Welcome to my page!</p>
    </header>

    <main>
      <section>
        <h2>PROFILE</h2>
        <p><strong>名前：</strong> tko</p>
        <p><strong>キャッチコピー：</strong> 足が速いです</p>
      </section>

      <section>
        <h2>HOBBY</h2>
        <p>・釣り</p>
        <p>・野球観戦</p>
      </section>

      <section>
        <h2>PROGRAMMING</h2>
        <p>プログラミング経験はまだほとんどありません。</p>
        <p>これから少しずつ勉強していきたいです。</p>
      </section>

      <section>
        <h2>MY GOAL</h2>
        <p>GitやGitHubの使い方を覚えて、プログラムやファイルを管理できるようになりたいです。</p>
      </section>

      <section class="message">
        <h2>MESSAGE</h2>
        <p>これからプログラミングを頑張りたいです。</p>
        <p>就職も頑張りたいです！</p>
      </section>
    </main>

    <footer>
      Thank you for visiting my page!
    </footer>
  </div>
</body>
</html>
